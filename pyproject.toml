[project]
name = "jira-backlog-check"
version = "0.1.0"
description = "회의록에서 이슈 후보를 뽑아 기존 Jira 백로그와 대조하고, 사람이 Confluence 검토 문서에서 확인한 것만 Jira에 반영하는 도구"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.9.0",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "slack-sdk>=3.44.1",
]

[project.scripts]
pm-agent = "pm_agent.__main__:main"

# 명령(pm-agent)을 설치하려면 빌드 설정이 있어야 한다. 프롬프트와 기본 양식은 pm_agent/ 안에 있어 함께 들어간다
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pm_agent"]
